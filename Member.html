<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Page - 𝕾𝖚𝖘 𝕻𝖗𝖔𝕲𝖆𝖒𝖊𝖗𝖘</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow: hidden; /* Prevents scrolling */
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the video covers the entire area */
            z-index: -1; /* Places the video behind other content */
        }

        header {
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
            border: solid purple;
            border-radius: 5px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
        }

        nav ul li a:hover {
            background-color: rgba(100, 13, 122, 0.5);
            border-radius: 0px;
        }

        .welcome-message {
            color: #00ffff; /* Cyan color for the glow effect */
            font-size: 1.5em; /* Increase font size for better visibility */
            margin-left: 20px; /* Space between the title and the welcome message */
            padding: 10px; /* Add padding for better spacing */
            text-shadow: 
                0 0 5px rgba(0, 255, 255, 0.7), /* Light glow */
                0 0 10px rgba(0, 255, 255, 0.5), /* Medium glow */
                0 0 15px rgba(0, 255, 255, 0.3); /* Stronger glow */
        }

        .member-list {
            display: flex;
            flex-direction: column; /* Stack members vertically */
            align-items: center; /* Center align the member cards */
            justify-content: center; /* Center align the member cards */
            margin-top: 20px;
            padding: 20px; /* Add padding around the member list */
        }

        .member-card {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0; /* Margin only on top and bottom */
            width: 300px; /* Fixed width for cards */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .member-card:hover {
            transform: scale(1.05); /* Scale effect on hover */
        }

        .member-card h3 {
            margin: 0;
            font-size: 1.5em; /* Increase font size for member names */
            text-shadow: 
                0 0 5px rgba(0, 255, 255, 0.7), /* Light glow */
                0 0 10px rgba(0, 255, 255, 0.5), /* Medium glow */
                0 0 15px rgba(0, 255, 255, 0.3); /* Stronger glow */
        }

        .member-card p {
            margin: 5px 0;
            font-size: 1.2em; /* Increase font size for email */
            color: #ffffff; /* Text color */
            text-shadow: 
                0 0 5px rgba(255, 255, 255, 0.7), /* Light glow */
                0 0 10px rgba(255, 255, 255, 0.5), /* Medium glow */
                0 0 15px rgba(255, 255, 255, 0.3); /* Stronger glow */
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="bgvid">
        <source src="Solo-leveling.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <header>
        <h1>𝕾𝖚𝖘 𝕻𝖗𝖔𝕲𝖆𝖒𝖊𝖗𝖘</h1>
        <nav>
            <ul>
                <li><a href="Project.html">Home</a></li>
                <li><a href="Topic.html">Topics</a></li>
                <li><a href="Member.html">Members</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="welcome-message">Welcome to our <br> Members Page!</div>
    </header>

    <div class="member-list" id="member-list">
        <!-- Member cards will be dynamically inserted here -->
    </div>

    <script>
        // Function to fetch member data from members.php
        async function fetchMembers() {
            try {
                const response = await fetch('members.php');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const members = await response.json();
                displayMembers(members);
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        // Function to display members in the member list
        function displayMembers(members) {
            const memberList = document.getElementById('member-list');
            memberList.innerHTML = ''; // Clear existing content

            members.forEach((member, index) => {
                const memberCard = document.createElement('div');
                memberCard.className = 'member-card';
                memberCard.innerHTML = `
                    <h3>${index + 1}. ${member.Name}</h3>
                    <p>${member['E-mail']}</p>
                `;
                memberList.appendChild(memberCard);
            });
        }

        // Fetch members when the page loads
        window.onload = fetchMembers;
    </script>
</body>
</html>
