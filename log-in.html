    <div class="login-container">
        <h2>Log In</h2>
        <form action="log-in.php" method="POST">
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="signup-text">
            <p style="display: inline;">Don't Have an Account?</p>
            <span class="signup-button" onclick="window.location.href='sign-up.html'">Sign Up</span>

<script>
    document.querySelector('.login-container form').addEventListener('submit', function(event) {
        // Get the email and password input values
        const email = document.querySelector('input[name="email"]').value;
        const password = document.querySelector('input[name="password"]').value;

        // Basic validation
        if (!email || !password) {
            alert("Please fill in both fields.");
            event.preventDefault(); // Prevent form submission
        } else {
            // Optionally, you can add more validation here (e.g., regex for email format)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                event.preventDefault(); // Prevent form submission
            }
        }
    });
</script>
