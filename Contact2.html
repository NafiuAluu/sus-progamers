<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - 𝕾𝖚𝖘 𝕻𝖗𝖔𝕲𝖆𝖒𝖊𝖗𝖘</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #fff;
    overflow: hidden; /* Prevents scrolling */
}

video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures the video covers the entire area */
    z-index: -1; /* Places the video behind other content */
}

header {
    /* background: rgba(0, 0, 0, 0.8); */
    color: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
}

nav ul li {
    display: inline;
    margin: 0 15px;
    border: solid purple;
    border-radius: 5px;
}

nav ul li a {
    color: #ffffff;
    text-decoration: none;
    padding: 5px 10px;
}

nav ul li a:hover {
    background-color: rgba(100, 13, 122, 0.5);
    border-radius: 0px;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
    border-radius: 10px;
}

h2 {
    text-align: center;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin: 10px 0 5px;
}

input, textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-bottom: 15px;
    background: #fff;
    color: #000;
}

button {
    padding: 10px;
    background: purple;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: rgba(100, 13, 122, 0.8);
}

.contact-info {
    margin-top: 20px;
    text-align: center;
}

.contact-info h3 {
    margin-bottom: 10px;
}

.contact-info p {
    margin: 5px 0;
}
    </style>
</head>
<body>
    <video autoplay muted loop id="bgvid">
        <source src="bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <header>
        <h1>𝕾𝖚𝖘 𝕻𝖗𝖔𝕲𝖆𝖒𝖊𝖗𝖘</h1>
        <nav>
            <ul>
                <li><a href="Project-2.html">Home</a></li>
                <li><a href="Topic2.html">Topics</a></li>
                <li><a href="Member2.html">Members</a></li>
                <li><a href="About2.html">About</a></li>
                <li><a href="Contact2.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Contact Us</h2>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-info">
            <h3>Contact Information</h3>
            <p>Email: susprogramers@email.com</p>
            <p>Phone: +1 (234) 567-8901</p>
            <p>Address: 123 Sus Street, Programming City, PC 12345</p>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission
    
            // Get form values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
    
            // Here you can handle the form data (e.g., send it to a server)
            console.log('Form submitted:', { name, email, message });
    
            // Display a success message (you can customize this)
            alert('Thank you for your message, ' + name + '! We will get back to you soon.');
    
            // Optionally, reset the form
            this.reset();
        });
    </script>
</body>
</html>
