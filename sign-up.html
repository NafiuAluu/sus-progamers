<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Stack header and content */
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the video covers the entire area */
            z-index: -1; /* Places the video behind other content */
        }

        header {
            /* background: #000000; */
            color: #fff;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 10px;
            border: solid purple;
            border-radius: 5px;
        }
        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
        }   
        nav ul li a:hover {
            background-color: rgba(100, 13, 122, 0.5);
            border-radius: 0px;
        }
        .auth-buttons {
            display: flex;
            align-items: center;
        }

        .auth-buttons button {
            background-color: rgba(100, 13, 122, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            margin-left: 10px;
            transition: background-color 0.3s;
        }
        .auth-buttons button:hover {
            background-color: #000000;
        }

        .signup-container {
            background: rgba(100, 13, 122, 0.5);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px; /* Set a width for the sign-up container */
            text-align: center; /* Center the text */
            margin: 100px auto; /* Center the signup container and add top margin to account for the fixed header */
        }

        h2 {
            margin-bottom: 20px;
            color: #ffffff;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(100, 13, 122, 0.5);
            border-radius: 25px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #43066b;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px; /* Space between buttons */
        }

        button:hover {
            background-color: rgba(100, 13, 122, 0.5);
        }

        .login-text {
            margin-top: 20px;
            color: #ffffff;
        }

        .login-button {
            cursor: pointer;
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

    <div class="signup-container">
        <h2>Sign Up</h2>
        <form action="sign-up-db.php" method="POST">
            <input type="text" name="name" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>

        <div class="login-text">
